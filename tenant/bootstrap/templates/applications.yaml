{{- $username := .Values.tenant.username }}
{{- $domain := .Values.deployer.domain }}
{{- $gitopsURL := printf "https://gitea-gitea-%s.%s/%s/mcp.git" $username $domain $username }}
{{- $gitopsRevision := .Values.targetRevision }}
{{- $litemaas := .Values.litemaas | default dict }}
{{- $password := .Values.tenant.password | default "" }}

{{- $apps := list
  (dict "name" "agent"            "repoURL" $gitopsURL "revision" $gitopsRevision "chart" "tenant/agent"          "namespace" (printf "agent-%s"         $username))
  (dict "name" "librechat"        "repoURL" "https://github.com/danny-avila/LibreChat" "revision" "v0.8.1" "chart" "helm/librechat" "namespace" (printf "librechat-%s" $username))
  (dict "name" "librechat-config" "repoURL" $gitopsURL "revision" $gitopsRevision "chart" "tenant/librechat"      "namespace" (printf "librechat-%s"     $username))
  (dict "name" "mcp-gitea"        "repoURL" $gitopsURL "revision" $gitopsRevision "chart" "tenant/mcp-gitea"      "namespace" (printf "mcp-gitea-%s"     $username))
  (dict "name" "mcp-openshift"    "repoURL" $gitopsURL "revision" $gitopsRevision "chart" "tenant/mcp-openshift"  "namespace" (printf "mcp-openshift-%s" $username))
}}

{{- range $app := $apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ $app.name }}-{{ $username }}"
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: tenants
  source:
    repoURL: {{ $app.repoURL }}
    targetRevision: {{ $app.revision }}
    path: {{ $app.chart }}
    helm:
      values: |
        namespace: {{ $app.namespace }}
        user: {{ $username }}
        domain: {{ $domain }}
        git_url: {{ $gitopsURL }}
        git_revision: {{ $gitopsRevision }}
        litemaas:
          url: {{ $litemaas.url | default "" | quote }}
          key: {{ $litemaas.key | default "" | quote }}
          models: {{ $litemaas.models | default "" | quote }}
        default_user:
          setup: true
          name: {{ $username | quote }}
          email: "{{ $username }}@example.com"
          password: {{ $password | quote }}
        secrets:
          creds_key: {{ sha256sum $username | quote }}
          jwt_secret: {{ sha256sum (printf "%s-jwt" $username) | quote }}
          jwt_refresh_secret: {{ sha256sum (printf "%s-refresh" $username) | quote }}
          meili_master_key: {{ sha256sum (printf "%s-meili" $username) | trunc 16 | quote }}
          custom_model_url: {{ $litemaas.url | default "tbd" | quote }}
          custom_model_key: {{ $litemaas.key | default "" | quote }}
        fullnameOverride: librechat
        podSecurityContext:
          fsGroup: null
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsNonRoot: false
          runAsUser: null
        ingress:
          enabled: false
        global:
          compatibility:
            openshift:
              adaptSecurityContext: force
        mongodb:
          image:
            tag: "latest"
          global:
            compatibility:
              openshift:
                adaptSecurityContext: force
        meilisearch:
          image:
            repository: docker.io/getmeili/meilisearch
            tag: v1.7.3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          podSecurityContext:
            runAsNonRoot: false
            runAsUser: null
            runAsGroup: null
            fsGroup: null
            fsGroupChangePolicy: null
          securityContext: {}
        librechat:
          configYamlContent: |-
            version: 1.3.1
            cache: true
            mcpServers:
              openshift:
                type: sse
                url: "http://mcp-openshift-proxy.mcp-openshift-{{ $username }}.svc.cluster.local:8080/sse#openshift"
              gitea:
                type: streamable-http
                url: "http://mcp-gitea-proxy.mcp-gitea-{{ $username }}.svc.cluster.local:8080/mcp"
              fetch:
                type: streamable-http
                url: "http://mcp-fetch-proxy.mcp-gitea-{{ $username }}.svc.cluster.local:8080/mcp"
              yardstick:
                type: streamable-http
                url: "http://mcp-yardstick-proxy.mcp-gitea-{{ $username }}.svc.cluster.local:8080/mcp"
            endpoints:
              custom:
              - name: "LiteMaaS"
                apiKey: "${CUSTOM_MODEL_KEY}"
                baseURL: {{ $litemaas.url | default "" | quote }}
                models:
                  default:
{{- range splitList "," ($litemaas.models | default "") }}
                  - {{ . | trim | quote }}
{{- end }}
                  fetch: true
                titleConvo: false
                summarize: false
                forcePrompt: false
                modelDisplayLabel: "Demo Dot LiteMaaS"
                capabilities:
                - "tools"
                dropParams:
                - "user"
                - "frequency_penalty"
                - "presence_penalty"
          configEnv:
            ALLOW_REGISTRATION: "true"
            ALLOW_EMAIL_LOGIN: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 2Gi
        volumes:
        - name: logs
          emptyDir: {}
        - name: logs-root
          emptyDir: {}
        volumeMounts:
        - name: logs
          mountPath: /app/api/logs
        - name: logs-root
          mountPath: /app/logs
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
{{- end }}
