{{- $username := .Values.tenant.username }}
{{- $domain := .Values.deployer.domain }}
{{- $repoURL := .Values.repoURL }}
{{- $revision := .Values.targetRevision }}

{{- $apps := list
  (dict "name" "agent"        "chart" "tenant/agent"        "namespace" (printf "agent-%s"        $username))
  (dict "name" "librechat"    "chart" "tenant/librechat"    "namespace" (printf "librechat-%s"    $username))
  (dict "name" "mcp-gitea"    "chart" "tenant/mcp-gitea"   "namespace" (printf "mcp-gitea-%s"    $username))
  (dict "name" "mcp-openshift" "chart" "tenant/mcp-openshift" "namespace" (printf "mcp-openshift-%s" $username))
  (dict "name" "librechat-config" "chart" "tenant/librechat-config" "namespace" (printf "librechat-%s" $username))
}}

{{- range $app := $apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ $app.name }}-{{ $username }}"
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: tenants
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ $revision }}
    path: {{ $app.chart }}
    helm:
      values: |
        namespace: {{ $app.namespace }}
        user: {{ $username }}
        domain: {{ $domain }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
{{- end }}
